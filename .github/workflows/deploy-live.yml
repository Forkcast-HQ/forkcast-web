# Auto-deploy the live preview on every push to main.
# Builds the static export (same as scripts/deploy-pages.sh) and publishes
# ONLY the compiled app to the public Pages repo (Seymurhh/forkcast-live).
# Source + docs stay private.
#
# One-time setup: add a repo secret named PAGES_DEPLOY_TOKEN
#   (GitHub → Settings → Secrets and variables → Actions → New repository secret)
#   Value: a fine-grained PAT with Contents: Read+Write on Seymurhh/forkcast-live.

name: Deploy live preview

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Static export cannot include server route handlers.
      - name: Remove server API routes for export
        run: rm -rf app/api

      # `dynamicParams = true` lets the SSR build serve restaurant and dish
      # slugs published after build time. `output: export` has no server to
      # do that on, so Next rejects the flag outright and the build dies on
      # /restaurant/[slug]/dish/[id]. scripts/deploy-pages.sh has always
      # patched this for its export build; this workflow never got the same
      # step, which is why every run from 2026-07-25 onward failed here.
      - name: Pin dynamicParams off for the export build
        run: |
          sed -i 's/export const dynamicParams = true;/export const dynamicParams = false;/' \
            'app/restaurant/[slug]/page.tsx' \
            'app/restaurant/[slug]/dish/[id]/page.tsx'
          grep -H 'dynamicParams' \
            'app/restaurant/[slug]/page.tsx' \
            'app/restaurant/[slug]/dish/[id]/page.tsx'

      # These secrets used to be described as optional ("absent = demo
      # mode"). They are not: with dynamicParams pinned off above,
      # generateStaticParams is the only source of restaurant and dish
      # routes, and lib/catalog.ts returns [] when Supabase is unconfigured.
      # Without them the build dies on a confusing "missing
      # generateStaticParams()", so say what is actually wrong instead.
      - name: Check Supabase secrets are present
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL is not set. The export build reads the catalog from Supabase to enumerate restaurant and dish routes; without it there are none to emit."
            exit 1
          fi

      - name: Build static export
        env:
          # The anon key is public-by-design; data is protected by RLS.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: STATIC_EXPORT=true PAGES_BASE_PATH=/forkcast-live NEXT_PUBLIC_BASE_PATH=/forkcast-live NEXT_PUBLIC_USE_REAL_AI=false npx next build

      - name: Publish to forkcast-live
        env:
          TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PAGES_DEPLOY_TOKEN secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          cd out
          touch .nojekyll
          git init -q -b main
          git config user.name "forkcast-deploy-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Deploy $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/Seymurhh/forkcast-live.git" main
